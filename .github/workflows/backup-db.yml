name: Respaldo diario de la base de datos

# Corre todos los días a las 06:00 UTC (03:00 en Montevideo) y también se
# puede disparar a mano desde la pestaña Actions ("Run workflow") para
# probarlo o sacar un respaldo extra antes de un cambio grande.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # El pg_dump que trae ubuntu-latest de fábrica es la v16 — Neon corre
      # Postgres 18, y pg_dump se niega a volcar un servidor más nuevo que
      # él mismo ("server version mismatch"). Se instala la v18 real desde
      # el repositorio oficial de PostgreSQL en vez de confiar en la que
      # venga preinstalada.
      - name: Instalar pg_dump 18 (repo oficial de PostgreSQL)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          sudo sh -c "echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Generar el dump de Postgres
        env:
          # Conexión DIRECTA (sin -pooler) a Neon: pg_dump necesita una
          # sesión real, no una del pooler en modo transacción.
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          FECHA=$(date -u +%Y-%m-%d)
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          # Formato "custom" (-Fc): comprimido y restaurable con pg_restore,
          # incluyendo restauración parcial (tabla por tabla) si hiciera falta.
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" -Fc --no-owner --no-privileges -f "gea-backup-$FECHA.dump"

      - name: Subir el respaldo a Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 no soporta el cálculo de checksum que trae por defecto
          # AWS CLI v2 desde sus versiones más recientes — sin esto, la
          # subida falla con un error de checksum mismatch.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp "gea-backup-$FECHA.dump" \
            "s3://${{ secrets.R2_BUCKET }}/gea-backup-$FECHA.dump" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
